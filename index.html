    <!-- Mobile-Fehler-Overlay: zeigt uncaught JS-Fehler ON-SCREEN, weil man auf
         dem Handy die DevTools-Konsole nicht sieht. MUSS als erstes Script laufen,
         damit es Fehler in allen folgenden Spiel-Skripten faengt. Rein additiv,
         kein Eingriff ins Spiel. Ausblenden per Tap auf das X. -->
    <script>
      (function () {
        var box = null, list = null, n = 0;
        function ensure() {
          if (box) return;
          box = document.createElement('div');
          box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:2147483647;max-height:45%;overflow:auto;background:rgba(120,0,0,0.94);color:#fff;font:12px/1.4 monospace;padding:8px 30px 8px 8px;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text;';
          var x = document.createElement('div');
          x.textContent = '✕';
          x.style.cssText = 'position:absolute;top:4px;right:8px;font-size:20px;cursor:pointer;padding:2px 8px;';
          x.addEventListener('click', function () { box.style.display = 'none'; });
          box.appendChild(x);
          list = document.createElement('div');
          box.appendChild(list);
          (document.body || document.documentElement).appendChild(box);
        }
        function show(msg) {
          try {
            ensure();
            box.style.display = 'block';
            n++;
            var line = document.createElement('div');
            line.style.cssText = 'border-top:1px solid rgba(255,255,255,0.25);margin-top:4px;padding-top:4px;';
            line.textContent = '#' + n + '  ' + msg;
            list.appendChild(line);
          } catch (e) { /* niemals selbst crashen */ }
        }
        window.addEventListener('error', function (ev) {
          var src = (ev.filename || '').split('/').pop();
          var where = src ? (' @ ' + src + ':' + (ev.lineno || '?') + ':' + (ev.colno || '?')) : '';
          var m = (ev.error && ev.error.stack) ? ev.error.stack : (ev.message || String(ev.error || 'Error'));
          show(m + where);
        });
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev.reason;
          show('Promise: ' + ((r && r.stack) ? r.stack : String(r)));
        });
        // Von aussen aufrufbar, um Fehler manuell anzuzeigen.
        window.__showError = show;
      })();
    </script>
